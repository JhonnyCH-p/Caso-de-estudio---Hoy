    <!-- ÁREA CENTRAL DEL COTIZADOR -->

            <section class="panel-inputs">
                <h2>Simulador de Financiamiento</h2>
                <p class="subtitle-panel">Cálculo basado en Sistema Francés</p>
                
                <div class="form-simulador">
                    <div class="field">
                        <label>Vehículo Seleccionado</label>
                        <input type="text" value="SUV Familiar Pro ($24,500)" readonly>
                    </div>
                    <div class="field">
                        <label>Plan Financiero Activo</label>
                        <input type="text" value="Plan Clásico" readonly>
                    </div>
                    <div class="field">
                        <label>Monto de Entrada ($)</label>
                        <input type="text" value="5,000" readonly>
                    </div>
                    <div class="field">
                        <label>Plazo Amortización</label>
                        <input type="text" value="24 Meses" readonly>
                    </div>
                    <button class="btn-calc-mock">Generar</button>
                </div>
            </section>
        </div>
